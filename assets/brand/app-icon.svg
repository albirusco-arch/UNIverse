<svg xmlns="http://www.w3.org/2000/svg" width="1024" height="1024" viewBox="0 0 1024 1024">
  <defs>
    <radialGradient id="bgGlow" cx="50%" cy="46%" r="60%">
      <stop offset="0" stop-color="#1B2470" stop-opacity="0.9"/>
      <stop offset="1" stop-color="#1B2470" stop-opacity="0"/>
    </radialGradient>
    <radialGradient id="bgViolet" cx="72%" cy="78%" r="45%">
      <stop offset="0" stop-color="#6B2FA8" stop-opacity="0.35"/>
      <stop offset="1" stop-color="#6B2FA8" stop-opacity="0"/>
    </radialGradient>
  </defs>
  <rect width="1024" height="1024" fill="#060913"/>
  <rect width="1024" height="1024" fill="url(#bgGlow)"/>
  <rect width="1024" height="1024" fill="url(#bgViolet)"/>
  <svg x="92" y="210" width="840" height="616" viewBox="320 330 600 440" fill="none">
  <defs>
    <linearGradient id="uLeft" x1="430" y1="360" x2="640" y2="760" gradientUnits="userSpaceOnUse">
      <stop offset="0" stop-color="#4E7BF7"/>
      <stop offset="0.55" stop-color="#3E58EF"/>
      <stop offset="1" stop-color="#3140D6"/>
    </linearGradient>
    <linearGradient id="uRight" x1="800" y1="356" x2="700" y2="760" gradientUnits="userSpaceOnUse">
      <stop offset="0" stop-color="#80B8F8"/>
      <stop offset="0.45" stop-color="#4F66F2"/>
      <stop offset="0.78" stop-color="#6A55F1"/>
      <stop offset="1" stop-color="#C46BF4"/>
    </linearGradient>
    <radialGradient id="violetGlow" cx="770" cy="705" r="90" gradientUnits="userSpaceOnUse">
      <stop offset="0" stop-color="#D179F6" stop-opacity="0.75"/>
      <stop offset="1" stop-color="#D179F6" stop-opacity="0"/>
    </radialGradient>
    <linearGradient id="foldShade" x1="610" y1="694" x2="700" y2="700" gradientUnits="userSpaceOnUse">
      <stop offset="0" stop-color="#141A7A" stop-opacity="0.6"/>
      <stop offset="1" stop-color="#141A7A" stop-opacity="0"/>
    </linearGradient>
    <radialGradient id="planet" cx="869" cy="438" r="18" gradientUnits="userSpaceOnUse">
      <stop offset="0" stop-color="#FFFFFF"/>
      <stop offset="0.65" stop-color="#E9ECFF"/>
      <stop offset="1" stop-color="#AEB9FF"/>
    </radialGradient>
    <linearGradient id="ringFront" x1="-288" y1="0" x2="288" y2="0" gradientUnits="userSpaceOnUse">
      <stop offset="0" stop-color="#D6DDFF"/>
      <stop offset="1" stop-color="#FFFFFF"/>
    </linearGradient>
    <filter id="glow" x="-20%" y="-60%" width="140%" height="220%">
      <feGaussianBlur stdDeviation="3.5" result="b"/>
      <feColorMatrix in="b" type="matrix" values="0 0 0 0 0.45  0 0 0 0 0.55  0 0 0 0 1  0 0 0 0.9 0" result="c"/>
      <feMerge><feMergeNode in="c"/><feMergeNode in="SourceGraphic"/></feMerge>
    </filter>
    <clipPath id="outsideU">
      <rect x="0" y="0" width="425" height="1000"/>
      <rect x="805" y="0" width="400" height="1000"/>
    </clipPath>
  </defs>
  <!-- back half of the orbit: only visible beside the U -->
  <g clip-path="url(#outsideU)">
    <g transform="translate(620 537) rotate(-13.5)">
      <path d="M 288 0 A 288 54 0 0 0 -288 0" stroke="#E4E8FF" stroke-width="5.5" stroke-linecap="round" filter="url(#glow)"/>
    </g>
  </g>
  <!-- U drawn as a folded ribbon: left arm and bowl, then right arm folding into the bowl -->
  <path d="M425 392 L538 356 L538 612 C538 660 572 694 614 694 L690 757 C665 760 640 760 614 760 C506 760 425 698 425 612 Z" fill="url(#uLeft)"/>
  <path d="M690 390 L805 356 L805 612 C805 690 750 745 690 757 C665 735 640 710 614 694 C656 694 690 660 690 612 Z" fill="url(#uRight)"/>
  <path d="M690 390 L805 356 L805 612 C805 690 750 745 690 757 C665 735 640 710 614 694 C656 694 690 660 690 612 Z" fill="url(#violetGlow)"/>
  <path d="M614 694 C640 710 665 735 690 757 L676 758 C655 738 635 716 614 700 Z" fill="url(#foldShade)"/>
  <!-- front half of the orbit, over the U -->
  <g transform="translate(620 537) rotate(-13.5)">
    <path d="M -288 0 A 288 54 0 0 0 288 0" stroke="url(#ringFront)" stroke-width="6" stroke-linecap="round" filter="url(#glow)"/>
  </g>
  <circle cx="869" cy="438" r="17" fill="url(#planet)" filter="url(#glow)"/>
</svg>
</svg>